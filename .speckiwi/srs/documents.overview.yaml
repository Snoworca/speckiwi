    type: functional
    title: overview.yaml 필수
    status: active
    priority: critical
    statement: 시스템은 `.speckiwi/overview.yaml`을 필수 파일로 요구해야 한다.
    tags: [overview]
  - id: FR-OVR-002
    type: interface
    title: MCP overview resource
    status: active
    priority: high
    statement: >
      시스템은 overview 문서를 MCP resource `speckiwi://overview`로 제공해야 한다.
    tags: [overview, mcp]
  - id: FR-OVR-003
    type: interface
    title: CLI overview 조회
    status: active
    priority: high
    statement: >
      시스템은 overview 문서를 CLI `speckiwi overview` 또는 동등 명령으로
