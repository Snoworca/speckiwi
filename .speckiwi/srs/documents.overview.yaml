  - id: FR-OVR-004
    type: functional
    title: 검색 대상 포함
    status: active
    priority: medium
    statement: >
      시스템은 overview의 `goals`, `nonGoals`, `glossary`를 검색 대상으로
      포함해야 한다.
    tags: [overview, search]
  - id: FR-OVR-005
    type: functional
    title: Markdown export 포함
    status: active
    priority: medium
    statement: 시스템은 overview 문서를 Markdown export에 포함할 수 있어야 한다.
