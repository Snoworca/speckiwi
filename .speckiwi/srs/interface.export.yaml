  - id: FR-EXP-004
    type: functional
    title: PRD export
    status: active
    priority: high
    statement: 시스템은 PRD 문서를 Markdown으로 export할 수 있어야 한다.
    tags: [export, prd]
  - id: FR-EXP-005
    type: functional
    title: technical export
    status: active
    priority: medium
    statement: 시스템은 technical 문서를 Markdown으로 export할 수 있어야 한다.
    tags: [export, technical]
  - id: FR-EXP-006
    type: functional
    title: ADR export
    status: active
    priority: medium
    statement: 시스템은 ADR 문서를 Markdown으로 export할 수 있어야 한다.
